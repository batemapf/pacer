name: Verify native feedback credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    steps:
      - name: Create, read, and close a native-style test request
        env:
          APP_CHANGE_GH_TOKEN: ${{ secrets.APP_CHANGE_GH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, uuid
          token = os.environ.get('APP_CHANGE_GH_TOKEN', '')
          if not token:
              raise SystemExit('APP_CHANGE_GH_TOKEN is missing.')
          if not token.startswith('github_pat_'):
              raise SystemExit('Use a dedicated fine-grained PAT for native feedback.')
          root = 'https://api.github.com/repos/batemapf/pacer/issues'
          def api(url, method='GET', value=None):
              payload = json.dumps(value).encode() if value is not None else None
              request = urllib.request.Request(url, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Speed-Up-or-Slow-Down', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          marker = '<!-- app-change-request:' + str(uuid.uuid4()) + ' -->'
          issue = api(root, 'POST', {
              'title': 'Native feedback smoke test — no agent work needed',
              'body': 'Automated verification of the native app submission contract. No product change requested.\n\nName supplied by tester (unverified): Anonymous tester\n\n' + marker,
              'labels': ['app-change']})
          number = issue['number']
          url = 'https://github.com/batemapf/pacer/issues/' + str(number)
          try:
              assert issue['html_url'] == url
              assert 'ready-for-agent' not in [label['name'] for label in issue['labels']]
              for attempt in range(4):
                  recent = api(root + '?state=all&sort=created&direction=desc&per_page=100')
                  if any(item['number'] == number and marker in (item.get('body') or '') for item in recent):
                      break
                  time.sleep(2)
              else:
                  raise AssertionError('Receipt lookup did not find the new issue after settling.')
              print('Native-style POST and retry receipt lookup passed: ' + url)
          finally:
              api(root + '/' + str(number), 'PATCH', {'state': 'closed', 'state_reason': 'not_planned'})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified native submission, receipt, retry lookup, and issue close with the dedicated token: ' + url + '\n')
          PY
