name: iOS build and pace tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Force a TestFlight upload after validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
jobs:
  release_changes:
    name: Check whether TestFlight upload is needed
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect app and release changes
        id: changes
        run: python3 scripts/testflight-changes.py
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate TestFlight scripts and profile checks
        run: |
          bash -n scripts/publish-testflight.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Test pace engine
        run: swift test
      - name: Build iOS app without signing
        run: xcodebuild -project Pacer.xcodeproj -scheme Pacer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build device release and app icon without signing
        run: xcodebuild -project Pacer.xcodeproj -scheme Pacer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
  testflight:
    name: Upload private TestFlight build
    needs: [check, release_changes]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.TESTFLIGHT_ENABLED == 'true' && needs.release_changes.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment: testflight
    concurrency:
      group: pacer-testflight
      cancel-in-progress: false
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
      IOS_WIDGET_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_APP_STORE_PROFILE_BASE64 }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      APP_CHANGE_GH_TOKEN: ${{ secrets.APP_CHANGE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this is still the latest main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testflight-upload-gate.py
      - name: Show upload Apple toolchain
        if: steps.latest.outputs.current == 'true'
        run: xcodebuild -version
      - name: Sign, archive, and upload to App Store Connect
        if: steps.latest.outputs.current == 'true'
        run: bash scripts/publish-testflight.sh
