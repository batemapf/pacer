name: Propose app change with Codex
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue with ready-for-agent label
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: app-change-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-agent')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      run: ${{ steps.prepare.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize requester and prepare trusted prompt
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/app-change-agent.py prepare
      - name: Confirm agent secrets are configured
        if: steps.prepare.outputs.run == 'true'
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUBLISH_TOKEN: ${{ secrets.CODEX_GH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo '::error::Add repository Actions secret OPENAI_API_KEY.'
            exit 1
          fi
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add repository Actions secret CODEX_GH_TOKEN.'
            exit 1
          fi
      - name: Evaluate and implement request
        if: steps.prepare.outputs.run == 'true'
        timeout-minutes: 10
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.162.1'
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/agent-prompt.txt
          output-schema-file: ${{ runner.temp }}/agent-schema.json
          output-file: ${{ runner.temp }}/agent-result.json
      - name: Enforce proposal boundary
        if: steps.prepare.outputs.run == 'true'
        id: proposal
        env:
          AGENT_BASE: ${{ steps.prepare.outputs.base }}
        run: python3 "$RUNNER_TEMP/app-change-agent.py" finalize
      - name: Save bounded proposal
        if: steps.prepare.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent-proposal/
          retention-days: 3
          if-no-files-found: error
  validate:
    needs: propose
    if: needs.propose.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent-proposal
      - name: Independently verify and apply bounded proposal
        id: validate
        run: python3 scripts/app-change-agent.py validate
      - name: Independently validate app change
        if: steps.validate.outputs.accepted == 'true'
        run: |
          swift test
          xcodebuild -project Pacer.xcodeproj -scheme Pacer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/AgentDerivedData" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Pacer.xcodeproj -scheme Pacer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/AgentDerivedData" CODE_SIGNING_ALLOWED=NO build
  publish:
    needs: [propose, validate]
    if: needs.propose.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent-proposal
      - name: Publish PR or request clarification
        env:
          GH_TOKEN: ${{ secrets.CODEX_GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Add repository Actions secret CODEX_GH_TOKEN with Contents, Issues, and Pull requests read/write.'
            exit 1
          fi
          python3 scripts/app-change-agent.py publish
